<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucid — New chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script src="theme.js"></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background-color: #171512; color: #f3eee5; font-family: 'Geist', sans-serif; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2e2922; border-radius: 9999px; }
  ::-webkit-scrollbar-thumb:hover { background: #3e372e; }
</style>
</head>
<body class="bg-surface-bg text-text-primary antialiased selection:bg-amber-accent/25 selection:text-white h-screen flex flex-col overflow-hidden">
<div class="w-full flex-1 flex h-screen overflow-hidden relative">
  <div id="sidebar-mount" class="contents"></div>

  <div class="flex-1 flex flex-col min-w-0 h-full overflow-hidden bg-surface-bg relative">
    <div id="header-mount"></div>

    <main class="flex-1 overflow-y-auto px-4 sm:px-8 md:px-12 py-6 pb-44">
      <div class="w-full max-w-3xl mx-auto">
        <div class="flex flex-col items-center text-center pt-8 sm:pt-16">

          <div class="w-14 h-14 rounded-full bg-surface-elevated border border-surface-border-subtle flex items-center justify-center shadow-lg">
            <div class="w-7 h-7 rounded-full border-2 border-amber-accent flex items-center justify-center relative">
              <span class="w-2 h-2 rounded-full bg-amber-accent absolute -top-0.5 right-0.5"></span>
            </div>
          </div>

          <h2 class="mt-6 text-[26px] sm:text-[32px] font-semibold tracking-tight leading-tight text-text-primary">
            How can Lucid help today?
          </h2>
          <p class="mt-3 max-w-md text-[14px] sm:text-[15px] leading-relaxed text-text-secondary">
            Ask a question, paste something to review, or start with one of these.
          </p>
        </div>

        <div class="mt-8 sm:mt-10 grid grid-cols-1 gap-3.5">
          <button type="button" onclick="applyPrompt('Explain the difference between server-sent events and WebSockets, and when to choose each.')"
            class="group text-left p-4 sm:p-5 rounded-xl bg-surface-elevated/70 hover:bg-surface-elevated border border-surface-border hover:border-surface-border-subtle transition-all duration-200 shadow-md flex items-center justify-between gap-4">
            <div class="min-w-0">
              <p class="text-[14px] font-medium text-text-primary">Explain SSE versus WebSockets</p>
              <p class="mt-1 text-[13px] text-text-secondary">Compare transport, reconnection, and the trade-offs for a chat interface.</p>
            </div>
            <span class="w-8 h-8 rounded-full bg-surface-bg border border-surface-border text-text-muted group-hover:text-amber-accent group-hover:border-amber-accent/40 group-hover:translate-x-1 flex items-center justify-center shrink-0 transition-all">
              <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
            </span>
          </button>

          <button type="button" onclick="applyPrompt('Review this PostgreSQL table for missing indexes and explain which query patterns each index would help.')"
            class="group text-left p-4 sm:p-5 rounded-xl bg-surface-elevated/70 hover:bg-surface-elevated border border-surface-border hover:border-surface-border-subtle transition-all duration-200 shadow-md flex items-center justify-between gap-4">
            <div class="min-w-0">
              <p class="text-[14px] font-medium text-text-primary">Review a table for missing indexes</p>
              <p class="mt-1 text-[13px] text-text-secondary">Paste a schema and ask for an index and query review.</p>
            </div>
            <span class="w-8 h-8 rounded-full bg-surface-bg border border-surface-border text-text-muted group-hover:text-amber-accent group-hover:border-amber-accent/40 group-hover:translate-x-1 flex items-center justify-center shrink-0 transition-all">
              <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
            </span>
          </button>

          <button type="button" onclick="applyPrompt('Write a Go worker pool that processes jobs with context cancellation and graceful shutdown.')"
            class="group text-left p-4 sm:p-5 rounded-xl bg-surface-elevated/70 hover:bg-surface-elevated border border-surface-border hover:border-surface-border-subtle transition-all duration-200 shadow-md flex items-center justify-between gap-4">
            <div class="min-w-0">
              <p class="text-[14px] font-medium text-text-primary">Write a Go worker pool</p>
              <p class="mt-1 text-[13px] text-text-secondary">Ask for code with cancellation, error handling, and shutdown.</p>
            </div>
            <span class="w-8 h-8 rounded-full bg-surface-bg border border-surface-border text-text-muted group-hover:text-amber-accent group-hover:border-amber-accent/40 group-hover:translate-x-1 flex items-center justify-center shrink-0 transition-all">
              <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
            </span>
          </button>
        </div>
      </div>
    </main>

    <div class="fixed bottom-0 left-0 lg:left-[260px] right-0 z-30 p-3 sm:p-5 pointer-events-none bg-gradient-to-t from-surface-bg via-surface-bg/95 to-transparent">
      <div id="composer-mount" class="max-w-3xl mx-auto pointer-events-auto"></div>
    </div>
  </div>
</div>

<script src="shell.js"></script>
<script>
  LucidShell.mount({
    activeId: null,
    title: "New chat",
  });

  function applyPrompt(text) {
    var textarea = document.querySelector("#composer-mount textarea");
    if (!textarea) {
      return;
    }
    textarea.value = text;
    textarea.focus();
    var dock = textarea.closest(".bg-surface-elevated");
    if (dock) {
      dock.classList.add("border-amber-border");
      setTimeout(function () {
        dock.classList.remove("border-amber-border");
      }, 800);
    }
  }
</script>
</body>
</html>
