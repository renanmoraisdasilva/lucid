services:
  db:
    image: postgres:17
    container_name: lucid-db
    environment:
      POSTGRES_USER: lucid
      POSTGRES_PASSWORD: lucid
      POSTGRES_DB: lucid
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lucid -d lucid"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
