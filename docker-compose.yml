services:
  db:
    image: postgres:17
    container_name: lucid-db
    environment:
      POSTGRES_USER: lucid
      POSTGRES_PASSWORD: lucid
      POSTGRES_DB: lucid
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lucid -d lucid"]
      interval: 5s
      timeout: 3s
      retries: 10

  # `docker compose --profile full up --build` runs the whole application.
  backend:
    profiles: ["full"]
    build: ./backend
    container_name: lucid-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://lucid:lucid@db:5432/lucid
      PROVIDER: ${PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-low}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RECONCILE_ON_STARTUP: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "--no-dev",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    profiles: ["full"]
    build: ./frontend
    container_name: lucid-web
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  pgdata:
